[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-rca"
version = "0.4.0"
description = "An evidence-first AI agent that finds the root cause of production incidents across logs, databases, code and tickets."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Karthik Kasukurti" }]
keywords = ["llm", "agents", "root-cause-analysis", "sre", "rag", "evals", "incident-response", "mcp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: System :: Monitoring",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
embeddings = ["sentence-transformers>=2.7"]
otel = ["opentelemetry-sdk>=1.24"]
dev = ["pytest>=8", "ruff>=0.5", "fastapi>=0.110", "uvicorn[standard]>=0.29", "matplotlib>=3.8"]

[project.scripts]
orion = "orion.cli:main"

[tool.setuptools.packages.find]
include = ["orion*"]

[tool.setuptools.package-data]
orion = ["estate/kb/*.md", "estate/flows.yaml", "estate/repos/**/*", "estate/scenarios/*.yaml", "evals/sets/*.yaml", "server_static/*", "estate/kb/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM108"]
